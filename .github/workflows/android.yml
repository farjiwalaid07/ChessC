name: ChessCrazy Android
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          export PATH="/usr/local/lib/android/sdk/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "cmake;3.22.1" "ndk;28.2.13676358"
      - name: Native chess smoke tests
        run: |
          g++ -std=c++17 -O2 tests/chess_smoke.cpp app/src/main/cpp/chess.cpp -o chess_smoke
          ./chess_smoke
      - name: Cloudflare Worker audit\n        working-directory: server\n        run: |\n          npm install\n          npx wrangler deploy --dry-run --outdir /tmp/chesscrazy-worker\n      - name: Build debug
        run: gradle --no-daemon --stacktrace assembleDebug
      - name: Build release
        run: gradle --no-daemon --stacktrace assembleRelease
      - name: 16 KB native alignment audit\n        run: |\n          mkdir -p /tmp/apk-audit\n          unzip -p app/build/outputs/apk/release/ChessCrazy-release.apk lib/arm64-v8a/libjoyce_chess.so > /tmp/apk-audit/libjoyce_chess.so\n          "$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" -lW /tmp/apk-audit/libjoyce_chess.so | tee /tmp/apk-audit/readelf.txt\n          ! grep -E "LOAD.*0x1000" /tmp/apk-audit/readelf.txt\n      - uses: actions/upload-artifact@v4
        with:
          name: ChessCrazy-APK
          path: |
            app/build/outputs/apk/debug/ChessCrazy-debug.apk
            app/build/outputs/apk/release/ChessCrazy-release.apk
          retention-days: 14
